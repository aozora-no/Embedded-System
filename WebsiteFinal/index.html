<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HygieneMist</title>
</head>
<body>

<main class="container" id="dashboard">

  <header>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-12Z"/>
          <path d="M8 15a4 4 0 0 0 4 4"/>
        </svg>
      </span>
      <h1>HygieneMist</h1>
    </div>
  </header>

  <nav class="navigation" aria-label="Dashboard sections">
    <a href="#overview">Overview</a>
  </nav>

  <div class="overview" id="overview">

    <section class="card system-card">
      <h2>System Status</h2>

      <div class="status-grid">
        <div>
          <span>Connection</span>
          <strong id="connection">Not connected yet</strong>
        </div>

        <div>
          <span>Mode</span>
          <strong id="mode">--</strong>
        </div>

        <div>
          <span>Last mode change</span>
          <strong id="changed">--</strong>
        </div>

        <div>
          <span>Sensor update</span>
          <strong id="freshness">--</strong>
        </div>
      </div>

      <p id="message" class="feedback" role="status"></p>
      <p id="deviceError" class="feedback error" role="status"></p>

    </section>

  </div>

  <section class="card sensor-card">
    <h2>Sensor Data</h2>

    <div class="grid">

      <div class="sensor">
        <h3>Distance</h3>
        <div class="value" id="distance">--</div>
        <small>mm</small>
      </div>

      <div class="sensor">
        <h3>Weight</h3>
        <div class="value" id="weight">--</div>
        <small>g</small>
      </div>

      <div class="sensor">
        <h3>Object detected</h3>
        <div class="value" id="objectDetected">--</div>
        <small>0 / 1</small>
      </div>

      <div class="sensor">
        <h3>Non-contact 1</h3>
        <div class="value" id="noncontact1">--</div>
        <small>0 / 1</small>
      </div>

      <div class="sensor">
        <h3>Non-contact 2</h3>
        <div class="value" id="noncontact2">--</div>
        <small>0 / 1</small>
      </div>

      <div class="sensor">
        <h3>Pump</h3>
        <div class="value" id="pump">--</div>
        <small>0 / 1</small>
      </div>

      <div class="sensor">
        <h3>Non-contact level</h3>
        <div class="value" id="level">--</div>
      </div>

      <div class="sensor">
        <h3>Weight status</h3>
        <div class="value" id="weightStatus">--</div>
      </div>

    </div>
  </section>

</main>

</body>
</html>
